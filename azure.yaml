# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: foundry-showcase
requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
services:
    ai-project:
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 10
                name: GlobalStandard
        host: azure.ai.project
    volt-assistant:
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Volt and Co synthetic electronics assistant. Uses the GitHub Copilot SDK and three read-only catalog, compatibility and recall tools. Evaluates candidate behavior before release and turns reviewed observations into regression tests.
        displayName: Volt and Co
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            PYTHONNOUSERSITE: "1"
            VOLT_VARIANT: ${VOLT_VARIANT}
            APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
        host: azure.ai.agent
        kind: hosted
        language: python
        metadata:
            tags:
                - AI Agent Hosting
                - GitHub Copilot SDK
                - Invocations Protocol
                - Synthetic data only
        name: volt-assistant
        project: src/github-copilot-invocations
        protocols:
            - protocol: invocations
              version: 2.0.0
        uses:
            - ai-project
