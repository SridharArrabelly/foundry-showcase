# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: volt-citadel-support
services:
  volt-support:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Streaming
    project: src
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    kind: hosted
    name: volt-support
    description: Synthetic Volt support with Citadel model access, a versioned Foundry toolbox and native evaluation.
    policies:
      - type: rai_policy
        raiPolicyName: /subscriptions/40b687ca-31b5-4374-bea2-4c178369b9c0/resourceGroups/rg-volt-citadel/providers/Microsoft.CognitiveServices/accounts/fdy-volt-citadel-261111/raiPolicies/volt-support-guardrails
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      VOLT_MODEL_CONNECTION: ${VOLT_MODEL_CONNECTION}
      VOLT_MEMORY_ENABLED: ${VOLT_MEMORY_ENABLED}
      TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
