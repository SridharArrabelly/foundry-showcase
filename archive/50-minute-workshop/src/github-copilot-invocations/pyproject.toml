[project]
name = "volt-foundry-showcase"
version = "0.1.0"
description = "Synthetic Volt and Co Copilot SDK agent, hosted and operated in Microsoft Foundry."
requires-python = ">=3.12"
dependencies = [
    "azure-ai-agentserver-invocations==1.1.0",
    "azure-identity>=1.17.0",
    "github-copilot-sdk==1.0.11",
    "python-dotenv==1.1.1",
    "pydantic>=2.10,<3",
    "azure-monitor-opentelemetry>=1.8,<2",
]

[dependency-groups]
dev = [
    "azure-ai-projects>=2.8,<3",
]
