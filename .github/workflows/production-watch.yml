name: Production watch (scheduled evaluation)

# Operate: re-score the serving DEMO agent on a schedule so drift is caught by a
# measurement, not by a customer. Uses the same capture + native evaluator as the
# release gate. Switch DATASET/EVAL_ID to v2 once the v2 grader is registered.

on:
  schedule:
    - cron: "0 6 * * 1"     # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: volt-production-watch
  cancel-in-progress: false

env:
  PROJECT_ENDPOINT: ${{ vars.VOLT_DEMO_PROJECT_ENDPOINT }}
  EXPECTED_VERSION: ${{ vars.VOLT_DEMO_AGENT_VERSION }}
  EVAL_ID: ${{ vars.VOLT_DEMO_EVAL_ID }}
  DATASET: agent/src/.foundry/datasets/volt-regression.jsonl
  GH_TOKEN: ${{ github.token }}

jobs:
  watch:
    environment: volt-demo-monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.VOLT_DEMO_MONITOR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Capture fresh responses from the serving agent
        working-directory: agent/src
        run: |
          OUT=../../.runtime/watch-$(date -u +%Y%m%d-%H%M%S)
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          uv sync --locked --python 3.13
          uv run python ../../scripts/capture_cases.py --project-endpoint "$PROJECT_ENDPOINT" \
            --expected-version "$EXPECTED_VERSION" --dataset "../../$DATASET" --fresh --out "$OUT" --pause-seconds 20
      - name: Score them with the native business evaluator
        working-directory: agent/src
        run: |
          uv run python ../../scripts/evaluate_captures.py --project-endpoint "$PROJECT_ENDPOINT" \
            --captures "$OUT/captured.jsonl" --dataset "../../$DATASET" --label "Production watch" \
            --out "$OUT/evaluation.json" --eval-id "$EVAL_ID" --require-all-pass
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volt-production-watch-${{ github.run_id }}
          path: .runtime
          retention-days: 90
      - name: A failing watch becomes an issue (Bridge 2 starts here)
        if: failure()
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue create --title "Production watch failed for DEMO v$EXPECTED_VERSION" \
            --label "production-finding" \
            --body "The scheduled evaluation of the serving agent failed. Case file: $RUN_URL. Triage the failing case, add it to the regression dataset, then fix through a PR (the PR gate will re-evaluate)."
