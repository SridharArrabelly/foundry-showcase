name: Volt live candidate and release
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Baseline must be blocked before deployment."
        type: choice
        options: [improved, baseline]
        default: improved
permissions:
  contents: read
  id-token: write
concurrency:
  group: volt-live-demo-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Gate the business contract before cloud deployment
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_contract.py --variant "$VARIANT"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - name: Configure existing demo infrastructure
        env:
          PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          PROJECT_ID: ${{ vars.AZURE_AI_PROJECT_ID }}
          MODEL: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          LOCATION: ${{ vars.AZURE_LOCATION }}
          APPINSIGHTS: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          azd ext install microsoft.foundry
          azd config set auth.useAzCliAuth true
          azd env new ci --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "$SUBSCRIPTION"
          azd env set AZURE_TENANT_ID "$TENANT"
          azd env set AZURE_LOCATION "$LOCATION"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$PROJECT_ENDPOINT"
          azd env set AZURE_AI_PROJECT_ENDPOINT "$PROJECT_ENDPOINT"
          azd env set AZURE_AI_PROJECT_ID "$PROJECT_ID"
          azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$MODEL"
          azd env set APPLICATIONINSIGHTS_CONNECTION_STRING "$APPINSIGHTS"
          azd env set VOLT_VARIANT improved
      - name: Deploy candidate, not an approved production release
        run: azd deploy volt-assistant --no-prompt
      - name: Evaluate the exact version and write gated demo release pointer
        run: |
          set -euo pipefail
          VERSION=$(azd env get-value AGENT_VOLT_ASSISTANT_VERSION)
          python scripts/demo.py evaluate --version "$VERSION" --dataset datasets/core.jsonl --dataset datasets/regression.jsonl --out evidence/candidate.json
          python scripts/release.py --version "$VERSION" --report evidence/candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-release-evidence
          path: evidence/
