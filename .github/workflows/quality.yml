name: Volt quality gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "Use baseline to demonstrate a BLOCK, improved to demonstrate PASS."
        type: choice
        options: [improved, baseline]
        default: improved
permissions:
  contents: read
jobs:
  tool-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline business contract gate (not an LLM evaluation)
        env:
          VARIANT: ${{ inputs.variant || 'improved' }}
        run: |
          mkdir -p evidence
          python scripts/check_contract.py --variant "$VARIANT" > evidence/tool-contract.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-contract-evidence
          path: evidence/
